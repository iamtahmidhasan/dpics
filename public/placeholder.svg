<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 1600"
  width="1200"
  height="1600"
  role="img"
  aria-label="Decorative placeholder"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171717" />
      <stop offset="55%" stop-color="#262626" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafafa" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#fafafa" stop-opacity="0.04" />
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fafafa" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#fafafa" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#fafafa" stop-opacity="0" />
