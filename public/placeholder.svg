  </defs>

  <rect width="1200" height="1600" fill="url(#bg)" />

  <g opacity="0.5">
    <circle cx="340" cy="420" r="520" fill="url(#orb)" />
    <circle cx="920" cy="1240" r="440" fill="url(#orb)" />
  </g>

  <g stroke="#fafafa" stroke-opacity="0.08" stroke-width="2" fill="none">
    <path d="M-40 1180 L1240 320" />
    <path d="M-40 1400 L1240 540" />
    <path d="M-40 960 L1240 100" />
    <path d="M-40 1600 L1240 740" />
  </g>

  <rect
    x="120"
    y="120"
    width="960"
    height="1360"
    rx="48"
    fill="url(#glow)"
    stroke="#fafafa"
    stroke-opacity="0.12"
    stroke-width="2"
  />
