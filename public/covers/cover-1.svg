<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="c1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="c1-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="c1-indigo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="c1-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#c1-bg)"/>
  <rect width="1200" height="400" fill="url(#c1-grid)"/>
  <!-- Glowing Nodes and Orbs -->
  <circle cx="200" cy="120" r="140" fill="#38bdf8" opacity="0.12" filter="blur(40px)"/>
  <circle cx="950" cy="260" r="180" fill="#6366f1" opacity="0.15" filter="blur(50px)"/>
  <!-- Circuit Traces -->
  <path d="M-50,220 L250,220 L320,150 L580,150 L640,210 L920,210 L980,150 L1250,150" fill="none" stroke="url(#c1-cyan)" stroke-width="2.5"/>
  <path d="M-50,260 L180,260 L240,320 L500,320 L560,260 L800,260 L860,320 L1250,320" fill="none" stroke="url(#c1-indigo)" stroke-width="2"/>
  <path d="M150,50 L280,50 L340,110 L520,110 L580,50 L950,50 L1010,110 L1250,110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Digital Junctions -->
  <circle cx="250" cy="220" r="4.5" fill="#00f2fe"/>
  <circle cx="320" cy="150" r="4.5" fill="#4facfe"/>
  <circle cx="580" cy="150" r="5" fill="#6366f1"/>
  <circle cx="640" cy="210" r="4.5" fill="#a855f7"/>
  <circle cx="920" cy="210" r="5" fill="#00f2fe"/>
  <circle cx="240" cy="320" r="4" fill="#6366f1"/>
  <circle cx="560" cy="260" r="4.5" fill="#38bdf8"/>
  <circle cx="860" cy="320" r="4" fill="#a855f7"/>
  <!-- Floating Tech Data Accents -->
  <text x="1050" y="70" fill="#38bdf8" opacity="0.3" font-family="monospace" font-size="12">SYS.NODE::01</text>
  <text x="80" y="360" fill="#6366f1" opacity="0.3" font-family="monospace" font-size="12">DPICS // CORE_NET</text>
</svg>
