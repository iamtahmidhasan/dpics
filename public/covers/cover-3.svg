    <pattern id="c3-hex" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
      <path d="M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z M28 97 L56 81 L56 48 L28 64 L0 48 L0 81 Z" fill="none" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.12"/>
