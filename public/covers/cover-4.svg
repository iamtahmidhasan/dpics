<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="c4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190d09"/>
      <stop offset="50%" stop-color="#31150c"/>
      <stop offset="100%" stop-color="#120704"/>
    </linearGradient>
    <linearGradient id="c4-sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="c4-poly" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#c4-bg)"/>
  <!-- Glowing Horizon Sun -->
  <circle cx="850" cy="180" r="140" fill="url(#c4-sun)" opacity="0.8"/>
  <circle cx="850" cy="180" r="220" fill="#f59e0b" opacity="0.15" filter="blur(60px)"/>
  <!-- Horizon Line and Geometric Mountain Mesh -->
  <polygon points="-50,400 200,240 380,310 580,180 820,290 1020,160 1250,330 1250,400" fill="url(#c4-poly)"/>
  <path d="M-50,280 L250,280 L350,220 L750,220 L850,280 L1250,280" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>
  <line x1="0" y1="280" x2="1200" y2="280" stroke="#f97316" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="10,6"/>
  <!-- Stars / Digital dust -->
  <circle cx="120" cy="80" r="2" fill="#fed7aa"/>
  <circle cx="280" cy="60" r="1.5" fill="#fef3c7"/>
  <circle cx="450" cy="90" r="2" fill="#fed7aa"/>
  <circle cx="620" cy="50" r="2" fill="#fef3c7"/>
</svg>
