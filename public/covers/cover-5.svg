<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="c5-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030c1e"/>
      <stop offset="50%" stop-color="#0a1a3b"/>
      <stop offset="100%" stop-color="#020815"/>
    </linearGradient>
    <linearGradient id="c5-poly1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="c5-poly2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#c5-bg)"/>
  <!-- Polygonal Facets -->
  <polygon points="150,-50 350,120 50,-20" fill="url(#c5-poly1)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>
  <polygon points="350,120 600,-30 150,-50" fill="url(#c5-poly2)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>
  <polygon points="350,120 550,220 600,-30" fill="url(#c5-poly1)" stroke="#60a5fa" stroke-width="0.5" stroke-opacity="0.4"/>
  <polygon points="550,220 850,100 600,-30" fill="url(#c5-poly2)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>
  <polygon points="850,100 1100,-20 600,-30" fill="url(#c5-poly1)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>
  <polygon points="850,100 1050,240 1100,-20" fill="url(#c5-poly2)" stroke="#60a5fa" stroke-width="0.5" stroke-opacity="0.35"/>
  <polygon points="550,220 750,380 850,100" fill="url(#c5-poly1)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>
  <polygon points="350,120 400,360 550,220" fill="url(#c5-poly2)" stroke="#60a5fa" stroke-width="0.5" stroke-opacity="0.35"/>
  <polygon points="850,100 1150,380 1050,240" fill="url(#c5-poly1)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>
  <!-- Glow Nodes -->
  <circle cx="550" cy="220" r="5" fill="#38bdf8"/>
  <circle cx="850" cy="100" r="4.5" fill="#60a5fa"/>
  <circle cx="350" cy="120" r="4" fill="#93c5fd"/>
