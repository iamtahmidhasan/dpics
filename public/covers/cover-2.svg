<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="c2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0717"/>
      <stop offset="50%" stop-color="#180e2f"/>
      <stop offset="100%" stop-color="#090513"/>
    </linearGradient>
    <linearGradient id="c2-wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="c2-wave2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#c2-bg)"/>
  <!-- Ambient glow -->
  <circle cx="350" cy="180" r="160" fill="#a855f7" opacity="0.15" filter="blur(60px)"/>
  <circle cx="850" cy="220" r="180" fill="#ec4899" opacity="0.12" filter="blur(70px)"/>
  <!-- Flowing digital synth curves -->
  <path d="M-50,280 C200,120 400,380 650,220 C900,60 1050,300 1250,180 L1250,400 L-50,400 Z" fill="url(#c2-wave2)"/>
  <path d="M-50,220 C220,90 420,340 680,180 C940,20 1080,260 1250,140" fill="none" stroke="url(#c2-wave1)" stroke-width="3"/>
  <path d="M-50,250 C230,120 430,370 690,210 C950,50 1090,290 1250,170" fill="none" stroke="#d946ef" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,6"/>
  <!-- Constellation points -->
  <circle cx="280" cy="150" r="3" fill="#f472b6"/>
  <circle cx="450" cy="280" r="3.5" fill="#c084fc"/>
  <circle cx="680" cy="180" r="4.5" fill="#ffffff"/>
  <circle cx="900" cy="110" r="3" fill="#a78bfa"/>
  <circle cx="1060" cy="230" r="3.5" fill="#f472b6"/>
</svg>
