  <line x1="680" y1="175" x2="680" y2="225" stroke="#818cf8" stroke-width="0.75" opacity="0.6"/>
  <line x1="655" y1="200" x2="705" y2="200" stroke="#818cf8" stroke-width="0.75" opacity="0.6"/>
